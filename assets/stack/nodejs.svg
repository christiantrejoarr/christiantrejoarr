<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="118" viewBox="0 0 96 118" role="img" aria-label="Node.js">
  <title>Node.js</title>
  <style>
    .icon {
      transform-origin: 48px 40px;
      transform-box: fill-box;
    }
    .label {
      fill: #c9d1d9;
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-22px);
      transition: opacity 0.12s linear, transform 0.35s cubic-bezier(0.18, 1.4, 0.32, 1);
    }
    svg:hover .icon,
    a:hover .icon {
      animation: dogshake 0.55s ease-in-out;
    }
    svg:hover .label,
    a:hover .label {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.14s;
    }
    @keyframes dogshake {
      0% { transform: rotate(0deg) scale(1, 1); }
      12% { transform: rotate(-22deg) scale(1.08, 0.9); }
      24% { transform: rotate(22deg) scale(0.92, 1.08); }
      36% { transform: rotate(-18deg) scale(1.06, 0.92); }
      48% { transform: rotate(18deg) scale(0.94, 1.06); }
      60% { transform: rotate(-10deg) scale(1.03, 0.97); }
      72% { transform: rotate(10deg) scale(0.97, 1.03); }
      84% { transform: rotate(-4deg) scale(1.01, 0.99); }
      100% { transform: rotate(0deg) scale(1, 1); }
    }
  </style>
  <a href="https://nodejs.org/en/download" target="_blank" rel="noopener noreferrer">
    <rect width="96" height="118" fill="transparent"/>
    <g class="icon">
      <image href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64," x="20" y="12" width="56" height="56"/>
    </g>
    <clipPath id="drop-nodejs">
      <rect x="0" y="70" width="96" height="48"/>
    </clipPath>
    <g clip-path="url(#drop-nodejs)">
      <text class="label" x="48" y="96" text-anchor="middle">Node.js</text>
    </g>
  </a>
</svg>
