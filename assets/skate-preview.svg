<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Skate Stack mini game">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111822"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#sky)" stroke="#30363d"/>
  <text x="24" y="32" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="700" fill="#f7b801">SKATE STACK</text>
  <text x="876" y="32" text-anchor="end" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">CLICK</text>
  <rect x="0" y="214" width="900" height="66" fill="#161b22"/>
  <rect x="0" y="214" width="900" height="3" fill="#f7b801"/>
  <g stroke="rgba(240,246,252,0.2)" stroke-width="3" stroke-dasharray="18 16">
    <line x1="-40" y1="236" x2="980" y2="236">
      <animate attributeName="x1" values="-40; -74" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="980; 946" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <rect x="420" y="154" width="56" height="56" rx="10" fill="#21262d"/>
    <text x="448" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#61dafb">R</text>
    <rect x="620" y="148" width="62" height="62" rx="10" fill="#21262d"/>
    <text x="651" y="185" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#dd0031">NG</text>
    <rect x="820" y="158" width="50" height="50" rx="10" fill="#21262d"/>
    <text x="845" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#42b883">VUE</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; -520 0" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="110 206; 110 206; 110 118; 110 118; 110 206; 110 206" keyTimes="0;0.28;0.4;0.55;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <rect x="-24" y="-8" width="48" height="7" rx="2" fill="#111"/>
    <rect x="-22" y="-10" width="44" height="3" rx="1" fill="#f7b801"/>
    <circle cx="-16" cy="-1" r="4.5" fill="#d0d7de"/>
    <circle cx="16" cy="-1" r="4.5" fill="#d0d7de"/>
    <ellipse cx="2" cy="-48" rx="11" ry="10" fill="#f7b801"/>
    <rect x="-7" y="-40" width="18" height="22" rx="3" fill="#1f6feb"/>
    <rect x="-4" y="-18" width="6" height="14" fill="#0d1117"/>
    <rect x="6" y="-18" width="6" height="14" fill="#0d1117"/>
    <path d="M-8 -34 L-20 -24 M12 -34 L22 -18" stroke="#f0f6fc" stroke-width="3" fill="none"/>
  </g>

  <rect x="250" y="118" width="400" height="46" rx="8" fill="rgba(13,17,23,0.8)" stroke="#f7b801"/>
  <text x="450" y="147" text-anchor="middle" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700" fill="#f7b801">Click para ollie los logos</text>
</svg>
