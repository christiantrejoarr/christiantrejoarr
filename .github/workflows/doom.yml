name: Update DOOM ammo

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-doom.js"
      - ".github/workflows/doom.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate DOOM HUD from contributions
        run: node scripts/generate-doom.js

      - name: Commit HUD if contributions changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/doom-play.svg
          if git diff --cached --quiet; then
            echo "Las contribuciones no cambiaron"
          else
            git commit -m "chore: update DOOM ammo from contributions"
            git push
          fi
